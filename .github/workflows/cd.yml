name: CD

on:
  push:
    branches:
      - main
      - development
      - stage

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12.13"
  NODE_VERSION: "24"
  PNPM_VERSION: "9.15.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build API
        run: pnpm exec nx build api

      - name: Build web
        run: pnpm exec nx build web

      - name: Build API Docker image
        run: docker build -t notifications-hub-api apps/api

      - name: Build web Docker image
        run: docker build -f apps/web/Dockerfile -t notifications-hub-web --target base .

  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/notifications_hub_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notifications_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run API tests
        run: cd apps/api && pytest tests/ -v

      - name: Lint web
        run: pnpm exec nx lint web

  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'stage' && 'staging' || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        shell: bash
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build release API Docker image
        run: |
          docker build -t "notifications-hub-api:${{ steps.meta.outputs.tag }}" apps/api
          docker tag "notifications-hub-api:${{ steps.meta.outputs.tag }}" "notifications-hub-api:${{ steps.meta.outputs.branch }}"

      - name: Build release web Docker image
        run: |
          docker build -f apps/web/Dockerfile \
            -t "notifications-hub-web:${{ steps.meta.outputs.tag }}" \
            --target production .
          docker tag "notifications-hub-web:${{ steps.meta.outputs.tag }}" "notifications-hub-web:${{ steps.meta.outputs.branch }}"

      - name: Publish deployment summary
        run: |
          echo "Branch: ${{ steps.meta.outputs.branch }}"
          echo "Tag: ${{ steps.meta.outputs.tag }}"
          echo "Environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'stage' && 'staging' || 'development' }}"
          echo "Images ready: notifications-hub-api, notifications-hub-web"
          echo "Registry push and helm upload are not configured yet (see scripts/helm-chart-upload-noop.sh)."
