services:
  db:
    image: postgres:16-alpine
    container_name: notifications-hub-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-notifications_hub}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-notifications_hub}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - notifications-hub-network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: notifications-hub-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/notifications_hub}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - ENV_NAME=${ENV_NAME:-development}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api/app:/app/app
      - ./apps/api/alembic:/app/alembic
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - notifications-hub-network

  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: notifications-hub-temporal
    ports:
      - "7233:7233"
      - "8233:8233"
    env_file:
      - .env
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_SEEDS=db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - notifications-hub-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: notifications-hub-web
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NEXT_PUBLIC_GRAPHQL_URL=${NEXT_PUBLIC_GRAPHQL_URL:-http://localhost:8000/graphql}
      - GRAPHQL_ENDPOINT=${GRAPHQL_ENDPOINT:-http://api:8000/graphql}
    depends_on:
      api:
        condition: service_started
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    working_dir: /app/apps/web
    command: pnpm run dev -- --hostname 0.0.0.0 --port 3000
    restart: unless-stopped
    networks:
      - notifications-hub-network

networks:
  notifications-hub-network:
    driver: bridge

volumes:
  postgres_data:
  web_node_modules:
